@if (shouldShowMapButton && !isSettingsOpen) {
<button
  class="map-toggle"
  (click)="mapToggle.emit()"
  [attr.aria-label]="isMapVisible ? 'Hide map' : 'Show map'"
>
  <span class="material-icons">{{ isMapVisible ? 'close' : 'map' }}</span>
  <span class="toggle-text">{{
    isMapVisible ? (translations$ | async)?.back || 'Close' : 'Map'
  }}</span>
</button>
}
@if (shouldShowSeenButton && !isSettingsOpen) {
<button
  class="seen-toggle"
  (click)="seenToggle.emit()"
  [attr.aria-label]="(translations$ | async)?.seen || 'Seen'"
>
  @if (seenFilterActive) {
  <span class="material-icons">visibility</span>
  }
  <span class="toggle-text">{{ (translations$ | async)?.seen }}</span>
  <span class="count-badge">{{ seenCount }}</span>
</button>
}
