<div class="map-overlay" [class.visible]="isMapVisible" (click)="onOverlayClick()">
  <div class="map-container" (click)="$event.stopPropagation()">
    <div #mapContainer class="map" id="map"></div>
    <app-map-state-tiles
      [states]="states"
      [highlightedState]="highlightedState"
      [availableStates]="availableStates"
      [activeFilterText]="activeFilterText"
      (stateTileClick)="onStateTileClick($event)"
    ></app-map-state-tiles>
  </div>
</div>

<app-map-toggles
  [isMapVisible]="isMapVisible"
  [shouldShowMapButton]="shouldShowMapButton"
  [shouldShowSeenButton]="true"
  [isSettingsOpen]="isSettingsOpen"
  [seenFilterActive]="seenFilterActive"
  [seenCount]="seenCount"
  [translations$]="translations$"
  (mapToggle)="toggleMap()"
  (seenToggle)="onSeenFilterToggle()"
></app-map-toggles>
