<div class="settings-menu" (click)="$event.stopPropagation()">
  <div class="menu-header">
    <h3>{{ (translations$ | async)?.settings }}</h3>
    <button class="close-button" (click)="closed.emit()">
      <span class="material-icons">close</span>
    </button>
  </div>

  <div class="menu-content">
    <button class="menu-item" (click)="languageToggle.emit()">
      <span class="material-icons">translate</span>
      <div class="item-content">
        <span class="item-label">{{ (translations$ | async)?.language }}</span>
        <span class="item-value">{{ languageLabel }}</span>
      </div>
    </button>

    <button class="menu-item" (click)="themeCycle.emit()">
      <span class="material-icons">palette</span>
      <div class="item-content">
        <span class="item-label">{{ (translations$ | async)?.theme }}</span>
        <span class="item-value">{{ themeLabel }}</span>
      </div>
    </button>

    <button class="menu-item" (click)="syncOpen.emit()">
      <span class="material-icons">cloud</span>
      <span class="item-text">Enable Sync</span>
    </button>
  </div>
</div>
